name: CRB
description: >-
  CRB (Cross River Bank) is a New Jersey-chartered, FDIC-insured bank and
  financial technology infrastructure provider founded in 2008 and headquartered
  in Fort Lee, New Jersey. Cross River pairs a regulated bank with an API-driven
  core it calls the Cross River Operating System (COS), letting fintech
  companies, neobanks, lenders, and platforms embed banking, payments, cards,
  and lending products directly into their applications. Its developer platform
  exposes Accounts and Payments APIs spanning ACH, RTP, FedNow, wires,
  international payments, push-to-card, card issuing and processing, subledgers,
  lending origination, and onchain/stablecoin rails, secured with OAuth2 client
  credentials and delivered with an isolated sandbox, Postman collection,
  webhooks, and a dated changelog. Cross River is known for powering leading
  fintech partners including Stripe, Coinbase, Affirm, Upgrade, and Intuit, and
  was surfaced in the API Evangelist network as a Battery Ventures portfolio
  company.
